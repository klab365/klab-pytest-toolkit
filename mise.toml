[tools]
python = "3.14"
uv = "latest"

[settings]
python.uv_venv_auto = "create|source"

[env]
PLAYWRIGHT_BROWSERS_PATH = "{{config_root}}/.ms-playwright"
_.file = ".env"

# OS-level packages required by the test suite.
#
# * tkinter for the prompt package's UI dialogs
# * xvfb, xdotool, x11-utils, xauth for running headless UI tests under Xvfb
# * The Playwright Chromium runtime dependencies
#
# See https://mise.jdx.dev/bootstrap/packages/apt.html for the format.
# When packages are added or version-pinned here, commit the resulting
# mise.lock so reviewers see the intent.
[bootstrap.packages]
"apt:python3-tk"        = "latest"
"apt:xvfb"              = "latest"
"apt:xdotool"           = "latest"
"apt:x11-utils"         = "latest"
"apt:xauth"             = "latest"
"apt:libasound2t64"     = "latest"
"apt:libatk-bridge2.0-0t64" = "latest"
"apt:libatk1.0-0t64"    = "latest"
"apt:libatspi2.0-0t64"  = "latest"
"apt:libcairo2"         = "latest"
"apt:libcups2t64"       = "latest"
"apt:libdbus-1-3"       = "latest"
"apt:libdrm2"           = "latest"
"apt:libgbm1"           = "latest"
"apt:libglib2.0-0t64"   = "latest"
"apt:libnspr4"          = "latest"
"apt:libnss3"           = "latest"
"apt:libpango-1.0-0"    = "latest"
"apt:libx11-6"          = "latest"
"apt:libxcb1"           = "latest"
"apt:libxcomposite1"    = "latest"
"apt:libxdamage1"       = "latest"
"apt:libxext6"          = "latest"
"apt:libxfixes3"        = "latest"
"apt:libxkbcommon0"     = "latest"
"apt:libxrandr2"        = "latest"
"apt:fonts-noto-color-emoji" = "latest"
"apt:fonts-unifont"     = "latest"
"apt:libfontconfig1"    = "latest"
"apt:libfreetype6"      = "latest"
"apt:xfonts-cyrillic"   = "latest"
"apt:xfonts-scalable"   = "latest"
"apt:fonts-liberation"  = "latest"
"apt:fonts-ipafont-gothic" = "latest"
"apt:fonts-wqy-zenhei"  = "latest"
"apt:fonts-tlwg-loma-otf" = "latest"
"apt:fonts-freefont-ttf" = "latest"

[hooks]
# Runs every time ``mise install`` is invoked (e.g. on devcontainer start
# via devcontainer.json's postStartCommand, or after editing [tools]).
# Idempotent: both steps become no-ops when nothing needs to be done.
postinstall = [
    { task = "playwright-install" },
    { task = "install-system-deps" },
]

[tasks.playwright-install]
description = "Install Playwright chromium browser"
run = "uv run playwright install chromium"

[tasks.install-system-deps]
description = "Install OS packages required for tests via mise's built-in apt manager. Idempotent: only installs missing packages."
run = "mise bootstrap packages apply"

[tasks.clean]
description = "Clean project"
run = """
rm -rf .pytest_cache
rm -rf .mypy_cache
rm -rf __pycache__
rm -rf packages/**/__pycache__
rm -rf packages/*/__pycache__
rm -rf htmlcov
rm -rf coverage.xml
rm -rf pytest.xml
"""

[tasks.lint]
description = "Runs linting for python code"
run = [
    "uv run ty check .",
    "uv run ruff check .",
]

[tasks.format]
description = "Formats your code with Black, and sorts imports with isort"
run = [
    "uv run ruff format .",
    "uv run ruff check --fix .",
]

[tasks.check-format]
description = "Checks if the code is formatted correctly"
run = [
    "uv run ruff check .",
    "uv run ruff format --check .",
]

[tasks.test]
description = "run pytest with coverage"
usage = 'arg "[args]" help="pytest arguments" var=#true'
run = """
#!/usr/bin/env bash
set -euo pipefail
xvfb-run --auto-servernum uv run pytest \
    --junitxml=pytest.xml \
    --cov-report=term-missing:skip-covered \
    --cov-report=xml:coverage.xml \
    --cov=packages \
    ${usage_args:-} \
    packages
"""

[tasks.update-version]
description = "Update version in all packages"
usage = 'arg "<version>" help="Version to set for all packages"'
run = """
#!/usr/bin/env bash
set -euo pipefail
version="${usage_version?}"
echo "Updating all packages to version $version"
for pkg in packages/*/; do
    echo "Processing package $pkg"
    pkg_name=$(basename $pkg)
    module_name=$(echo $pkg_name | tr '-' '_')
    init_file="$pkg/src/$module_name/__init__.py"

    if [ ! -f "$init_file" ]; then
        echo "ERROR: __init__.py not found at $init_file for package $pkg_name"
        exit 1
    fi

    if ! grep -q '__version__' "$init_file"; then
        echo "ERROR: __version__ not found in $init_file for package $pkg_name"
        exit 1
    fi

    echo "Updating $pkg_name at $init_file"
    sed -i 's/__version__ = .*/__version__ = "'"$version"'"/' "$init_file"
done
"""

[tasks.build]
description = "Build all packages"
run = """
#!/usr/bin/env bash
set -euo pipefail
echo "Cleaning previous builds..."
rm -rf dist
mkdir -p dist

echo "Building all packages..."
for pkg in packages/*/; do
    if [ -f "${pkg}pyproject.toml" ]; then
        echo "Building $(basename $pkg)..."
        uv build "$pkg"
    fi
done

echo "Collecting distributions..."
for pkg in packages/*/; do
    if [ -d "${pkg}dist" ]; then
        cp "${pkg}dist"/* dist/ 2>/dev/null || true
    fi
done

echo "Build complete!"
ls -lh dist/
"""

[tasks.publish]
description = "Publish to PyPI (requires PYPI_TOKEN environment variable)"
usage = '''
arg "<token>" help="PyPI token"
arg "[args]" help="extra uv publish arguments" var=#true
'''
run = "echo \"Publishing to PyPI...\"\nuv publish dist/* --token ${usage_token?} ${usage_args:-}"
