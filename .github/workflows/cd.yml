name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: JSON array of package paths to publish
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Create release pull requests or GitHub releases
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for trusted publishing to PyPI.
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - name: Checkout released code
        uses: actions/checkout@v4
        with:
          # The release PR is the commit that triggered this workflow, so it
          # contains the version written by Release Please for this package.
          ref: ${{ github.sha }}

      - name: Install mise
        uses: jdx/mise-action@v2
        env:
          # Publishing only builds distributions, so Playwright and its OS
          # dependencies are not needed.
          MISE_NO_HOOKS: "1"

      - name: Build package
        env:
          PACKAGE: ${{ matrix.package }}
        run: uv build --out-dir "$PACKAGE/dist" "$PACKAGE"

      - name: Publish package to PyPI
        env:
          PACKAGE: ${{ matrix.package }}
        run: uv publish "$PACKAGE"/dist/* --token ${{ secrets.PYPI_API_TOKEN }}

  publish-existing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for trusted publishing to PyPI.
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        env:
          MISE_NO_HOOKS: "1"

      - name: Build package
        env:
          PACKAGE: ${{ matrix.package }}
        run: uv build --out-dir "$PACKAGE/dist" "$PACKAGE"

      - name: Publish package to PyPI
        env:
          PACKAGE: ${{ matrix.package }}
        run: uv publish "$PACKAGE"/dist/* --token ${{ secrets.PYPI_API_TOKEN }}
