name: CD - Build and Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing to PyPI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        env:
          # cd.yml doesn't run tests or invoke Playwright, so skip the
          # postinstall hooks (which would try to install Playwright
          # browsers and apt packages). We still need uv installed so
          # subsequent ``mise run build`` and ``mise run publish`` work.
          MISE_NO_HOOKS: "1"

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $TAG_NAME"

      - name: Update package versions
        run: mise run update-version ${{ steps.extract_version.outputs.VERSION }}

      - name: Build packages
        run: mise run build

      - name: Publish to PyPI
        run: mise run publish ${{ secrets.PYPI_API_TOKEN }}
