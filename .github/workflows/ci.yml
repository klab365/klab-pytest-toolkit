name: "CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check the PR head rather than GitHub's synthetic merge commit.
          # The rebase check below must inspect the commits authored on the PR.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require a rebased pull request branch
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BASE_BRANCH"
          git merge-base --is-ancestor "origin/$BASE_BRANCH" HEAD || {
            echo "Rebase this branch onto origin/$BASE_BRANCH before merging."
            exit 1
          }
          if git rev-list --merges "origin/$BASE_BRANCH..HEAD" | grep -q .; then
            echo "Pull request branches must be rebased; merge commits are not allowed."
            exit 1
          fi

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Check Format
        run: mise run format

      - name: Lint code
        run: mise run lint

      - name: Run tests
        run: mise run test

      - name: Pytest coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml

      - name: Build packages
        run: mise run build

      - name: Dry-run PyPI publication
        run: mise run publish ${{ secrets.PYPI_API_TOKEN }} --dry-run
